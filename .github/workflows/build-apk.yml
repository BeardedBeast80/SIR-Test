name: Build Android APK

# Builds a native, installable .apk that wraps the live Rivet SIR web app
# (hosted on GitHub Pages) using Bubblewrap (Google's Trusted Web Activity
# packaging tool). Runs entirely on GitHub's own runners, which have the
# internet access to the Android SDK / Gradle / Maven repositories needed to
# compile it -- this cannot be done from a sandboxed dev environment.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Bubblewrap at this runner's JDK/SDK (skips its interactive first-run setup)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}' "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.bubblewrap/config.json"

      - name: Install Bubblewrap
        working-directory: android
        run: npm install

      - name: Generate the signing key
        # NOTE: this generates a fresh signing key every run using the
        # password below (or repo secrets, if you add them -- see the
        # android/README section on making the app identity persistent
        # across rebuilds). Fine for sideloading; see README for details.
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD || 'RivetSIR-2026!' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD || 'RivetSIR-2026!' }}
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias rivetsir \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
            -dname "CN=Rivet, OU=RVT, O=Rivet, L=Unknown, ST=Unknown, C=US"

      - name: Scaffold the Android project from twa-manifest.json
        working-directory: android
        run: node generate-project.js

      - name: Build & sign the APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD || 'RivetSIR-2026!' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD || 'RivetSIR-2026!' }}
        run: npx bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rivet-sir-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
